[package]
name = "shadowquic"
repository = { workspace = true }
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
license = { workspace = true}
readme = { workspace = true}
[features]
default = ["shadowquic-quinn", "sunnyquic-noq", "ring", "statistics", "tproxy", "mixed", "plugin-vendored", "router-db", "dns-server", "router-dhcp-lease"]
# cost 1.4 mb
dns-server = ["dep:simple-dns", "dep:tokio-rustls-jls", "dep:rustls_jls"]
# cost 200k
statistics = ["dep:portable-atomic"]
# cost 200k
mixed = ["dep:base64"]
# cost about 2.4m
plugin-vendored = ["plugin", "mlua/vendored"] # compiling luajit from source
plugin-system = ["plugin"] # use system package provided luajit lib.
plugin = ["dep:mlua", "mlua/send", "mlua/async", "dep:notify"]
# cost about 2mb, requires plugin enabled
router-db = ["plugin", "dep:redb", "dep:maxminddb", "dep:sha2", "dep:regex", "dep:regex-automata", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio-rustls-jls", "dep:rustls_jls", "tokio-rustls-jls/tls12", "dep:url", "dep:tempfile"]
router-dhcp-lease = ["plugin"]
ring = [
    "dep:ring",
    "quinn?/rustls-ring",
    "quinn_proto?/rustls-ring",
    "rustls_jls?/ring",
    "noq?/rustls-ring",
    "noq-proto?/rustls-ring",
    "rustls?/ring",
    "rcgen/ring",
]
aws-lc-rs = [
    "dep:aws-lc-rs",
    "quinn?/rustls-aws-lc-rs",
    "quinn_proto?/rustls-aws-lc-rs",
    "rustls_jls?/aws_lc_rs",
    "noq?/rustls-aws-lc-rs",
    "noq-proto?/rustls-aws-lc-rs",
    "rustls?/aws-lc-rs",
    "rcgen/aws_lc_rs",
]
tokio-console = ["dep:console-subscriber","tokio/tracing"]
shadowquic-quinn = ["dep:quinn","dep:rustls_jls", "dep:quinn_proto"]
sunnyquic-gm-quic = ["dep:gm-quic","dep:qevent","dep:qbase","dep:qunreliable", "dep:rustls","dep:rustls-native-certs","dep:notify"]
# cost 3.6mb
sunnyquic-noq = ["dep:noq", "dep:rustls", "dep:rustls-native-certs","dep:notify", "dep:noq-proto"]
# cost 200k
tproxy = ["dep:etherparse", "dep:libc"]

[dependencies]
tempfile = { version = "3", optional = true }
redb = { version = "4", optional = true }
maxminddb = { version = "0.32", features = ["mmap"], optional = true }
sha2 = { version = "0.11", optional = true }
regex = { version = "1", optional = true }
regex-automata = { version = "0.4", features = ["dfa-build"], optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
url = { version = "2", optional = true }
simple-dns = { version = "0.12", optional = true }
# Version 0.1.0 requires early-data to compile its server implementation.
# TLS early data remains disabled in DNS and database download clients.
tokio-rustls-jls = { version = "0.1.0", default-features = false, features = ["early-data"], optional = true }
thiserror = "2.0.18"
tokio = {version = "1.52.3", features = ["io-util", "net","rt","macros","rt-multi-thread","signal","time"]}
tracing = "0.1.44"
time = { version = "0.3.47", features = ["macros", "local-offset"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "ansi", "time", "local-time"]}
quinn = { package = "quinn-jls", version = "0.3.8", default-features = false, features = ["runtime-tokio"], optional = true}
quinn_proto = { package = "quinn-proto-jls", version = "0.3.8", default-features = false, optional = true}
#quinn = { package = "quinn", git = "https://github.com/spongebob888/quinn-jls", branch = "jls-dev", default-features = false, features = ["runtime-tokio"], optional = true}
#quinn_proto = { package = "quinn-proto", git = "https://github.com/spongebob888/quinn-jls", branch = "jls-dev", default-features = false, optional = true}

#brutal-core = { git = "https://github.com/hrimfaxi/brutal_quinn.git", branch = "master" }
brutal-core = { version = "0.1.0" }
rustls_jls = { package = "rustls-jls", version = "1.3.7", default-features = false, features = ["std"], optional = true}

rcgen = { version = "0.14", default-features = false, features = ["crypto"] }
bytes = "1.11.0"
async-trait = "0.1.89"
webpki-roots = "1.0.7"
shadowquic-macros = { path = "../shadowquic-macros", version = ">=0.3.11" }
yaml-rust2 = "0.13.0"
serde = { version = "1.0.228", features = ["derive"]}
clap = { version = "4", features = ["derive"] }
educe = "0.8.1"
socket2 = "0.6.2"

gm-quic = { version = "0.4", default-features = false, optional = true}
# These types must match the versions used by gm-quic and qunreliable.
qevent = { version = "0.4", default-features = false, optional = true}
qbase = { version = "0.4", default-features = false, optional = true}
qunreliable = { version = "0.4", default-features = false, optional = true}
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true}
rustls-native-certs = {version = "0.8.3", optional = true}

# noq = { git = "https://github.com/hrimfaxi/iroh_quinn", branch = "main", package = "noq", optional = true, default-features = false, features = ["rustls-ring", "runtime-tokio"] }
# noq-proto = { git = "https://github.com/hrimfaxi/iroh_quinn", branch = "main", package = "noq-proto", optional = true, default-features = false, features = ["rustls-ring"] }

noq ={ version = "1.0.0-rc.1",optional = true, default-features = false, features = ["runtime-tokio"]}
noq-proto ={ version = "1.0.0-rc.1",optional = true, default-features = false}


notify = { version = "8.2.0", features = ["serde"], optional = true}
arc-swap = { version = "1.9.1"}

console-subscriber = { version = "0.5.0", optional = true }
serde-saphyr = "1.1.0"
aws-lc-rs = { version = "1", optional = true, default-features = false }
ring = { version = "0.17.14", optional = true }
base64 = { version = "0.23.1", optional = true }


[target.'cfg(target_os="linux")'.dependencies]
libc = { version = "0.2", optional = true }
etherparse = { version = "0.21.0", optional = true }

# LuaJIT has no RISC-V or LoongArch backend. Keep Lua 5.1 routing available
# on those architectures with the portable interpreter.
[target.'cfg(any(target_arch = "riscv64", target_arch = "loongarch64"))'.dependencies]
mlua = { version = "0.12", default-features = false, features = ["lua52"], optional = true }

[target.'cfg(not(any(target_arch = "riscv64", target_arch = "loongarch64")))'.dependencies]
mlua = { version = "0.12", default-features = false, features = ["luajit"], optional = true }

# 64-bit atomics via ll/sc CAS loop on targets without native AtomicU64 (e.g. 32-bit MIPS)
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1", optional = true }
[target.'cfg(target_os="android")'.dependencies]
sendfd = { version = "0.4.4", features = ["tokio"] }

[target.'cfg(target_os="windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
] }

[target.'cfg(target_os="macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }
tempfile = "3"
fast-socks5 = "1.0.0"
rand = "0.10.1"

[build-dependencies]
cc = "1"

[[example]]
name = "ip_lookup_bench"
required-features = ["router-db"]

[[example]]
name = "geosite_lookup_bench"
required-features = ["router-db"]
