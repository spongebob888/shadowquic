# cargo run --features dns-server -- -c shadowquic/config_examples/dns.yaml
inbounds:
  - tag: socks-in
    type: socks
    bind-addr: 127.0.0.1:1080
dns:
  - tag: resolver
    type: dns-quic # Use dns-tls for DNS over TLS instead.
    bind-addr: 127.0.0.1:1053
    upstream: 223.5.5.5:853
    server-name: dns.alidns.com
    zero-rtt: false # Default; set true to enable early data on resumed QUIC connections.
    bypass-cache: false # Set true to skip shared DNS cache reads and writes.
  - tag: fake
    type: dns-fakeip
    bind-addr: 127.0.0.1:1054
    ipv4-range: 198.18.0.0/15 # Optional; configure routes for the chosen ranges.
    ipv6-range: 2001:0002::/48
outbounds:
  - tag: direct
    type: direct
    dns: resolver
router:
  src: |
    return function(ctx)
      -- Resolver upstream traffic must use a transport outbound.
      if ctx.inbound_tag == "resolver" then return "direct" end
      if ctx.dst_port == 53 then
        return "fake"
      end
      return "direct"
    end
