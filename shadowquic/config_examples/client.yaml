inbounds:
  - tag: socks-inbound
    type: socks
    bind-addr: "127.0.0.1:1089"
outbounds:
  - tag: shadowquic-outbound
    type: shadowquic
    half-close-timeout: 60000 # TCP inactivity after either source reaches EOF, in ms; default 60000, 0 disables
    addr: "127.0.0.1:1443"
    username: "admin"
    password: "hello"
    server-name: "cloudflare.com" # must be the same as jls_upstream in server
    alpn: ["h3"]
    initial-mtu: 1300
    congestion-control: bbr
    zero-rtt: true
    gso: true # Enable Quinn Generic Segmentation Offload (GSO)
    over-stream: false  # true for udp over stream, false for udp over datagram
# Build with --features plugin to enable request routing. Use either inline
# source or a file path, not both.
# router:
#   src: |
#     return function(ctx) return "shadowquic-outbound" end
#   # Or replace src with:
#   # path: router.lua
log-level: "trace"
