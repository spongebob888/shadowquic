# cargo run --features restful-api -- -c shadowquic/config_examples/restful-api.yaml
inbounds:
  - tag: socks-in
    type: socks
    bind-addr: "127.0.0.1:1089"
outbounds:
  - tag: choice
    type: selector
    outbounds: [direct, blocked]
    selected: direct
  - tag: direct
    type: direct
  - tag: blocked
    type: drop
router:
  default-outbound: choice
restful-api:
  tag: restful-api
  bind-addr: "127.0.0.1:9090"
  # Serve the dashboard locally; download Squirrelboard v0.1.2 when index.html is missing.
  # ui-path: ./ui
  # ui-download-url: https://github.com/spongebob888/squirrelboard/releases/download/v0.1.2/index.html
  # secret: "choose-a-secret"
log-level: info
# Switch new sessions to blocked:
# curl -X PUT -H 'Content-Type: application/json' -d '{"selected":"blocked"}' http://127.0.0.1:9090/api/v1/outbounds/choice/selection
