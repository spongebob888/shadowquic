name: Documentation
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Bootstrap or rebuild the complete version history without a new release.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Both modes update the same archive and Pages deployment. Never overlap them.
concurrency:
  group: deploy-zensical
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation tooling from main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Restore published versions
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git branch gh-pages origin/gh-pages
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Setup Rust (nightly for rustdoc JSON)
        uses: dtolnay/rust-toolchain@nightly

      - name: Configure cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/docs-versions

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: assets/sites/uv.lock

      - name: Install typst
        uses: typst-community/setup-typst@v5

      - name: Setup pages
        uses: actions/configure-pages@v6

      - name: Test documentation versioning
        run: uv run --locked --project assets/sites python -m unittest discover -s assets/sites -p 'test_*.py'

      - name: Build released versions and main
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: uv run --locked --project assets/sites python assets/sites/build_versions.py --mode releases --output _site

      - name: Update main documentation only
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        run: uv run --locked --project assets/sites python assets/sites/build_versions.py --mode main --output _site

      - name: Save version archive
        run: git push origin gh-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
